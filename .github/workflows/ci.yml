name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: Playwright (system Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      # Run against the Google Chrome baked into the runner image instead
      # of a Playwright-managed download — see playwright.config.ts.
      PW_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # `npm install` is intentionally used over `npm ci`: the dependency
      # graph for @playwright/test includes platform-specific optional
      # binaries (e.g. @emnapi/* for Linux CI runners) that get filtered
      # out on Windows during local development. `npm install` resolves
      # the lockfile on the runner so all platform variants end up in
      # node_modules, while `npm ci` would error on the missing entries.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The browser is not downloaded: `PW_CHANNEL=chrome` resolves to
      # /usr/bin/google-chrome, which ships with the runner image along
      # with its system libraries. ffmpeg is still needed though — it is
      # a Playwright-managed binary (a few MB, not the ~170 MB browser),
      # and `video: "retain-on-failure"` fails every `newPage()` without
      # it, whether or not a video ends up being kept.
      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg

      # Log the Chrome version — it is a moving stable release, so it is
      # the first thing to check if the suite starts failing without a
      # code change.
      - name: Report browser version
        run: google-chrome --version

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
