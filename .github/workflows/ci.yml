name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # `npm install` is intentionally used over `npm ci`: the dependency
      # graph for @playwright/test includes platform-specific optional
      # binaries (e.g. @emnapi/* for Linux CI runners) that get filtered
      # out on Windows during local development. `npm install` resolves
      # the lockfile on the runner so all platform variants end up in
      # node_modules, while `npm ci` would error on the missing entries.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Key the browser cache on the resolved Playwright version rather
      # than on package-lock.json: the binaries are pinned to Playwright
      # itself, so hashing the lockfile would throw the cache away on
      # every unrelated dependency bump.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # ~/.cache/ms-playwright holds the chromium build, the headless
      # shell and ffmpeg. Restoring it skips the ~170 MB download, and
      # keeping Playwright's own browser keeps the fast headless shell —
      # the runner's system Chrome works but runs the suite ~45s slower.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` is deliberately omitted: it apt-installs system
      # libraries, which live outside the cached directory, so a cache
      # hit would silently skip them and behave differently from a miss.
      # The ubuntu-latest image already ships Chrome, Chromium, Edge and
      # Firefox, so those libraries are present either way.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
