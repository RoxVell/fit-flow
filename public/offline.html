<!DOCTYPE html>
<html lang="en" class="dark" style="min-height:100dvh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>FitFlow — Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#e5e5e5;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .icon{font-size:3rem;margin-bottom:1rem}
    h1{font-size:1.5rem;font-weight:600;margin-bottom:.5rem}
    p{color:#a3a3a3;font-size:.95rem;line-height:1.5;max-width:20rem}
    .btn{display:inline-block;margin-top:1.5rem;padding:.75rem 1.5rem;background:#c2410c;color:#fff;border:none;border-radius:.5rem;font-size:.95rem;font-weight:500;cursor:pointer;text-decoration:none}
    .btn:hover{background:#ea580c}
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>This page hasn't been cached yet. Connect to the internet and visit it once, then it will be available offline.</p>
  <a class="btn" href="/dashboard" onclick="location.reload();return false;">Try again</a>
</body>
</html>
